# Xcode project spec. Regenerate the project after editing:  xcodegen generate
name: Torrent

options:
  bundleIdPrefix: io.github.rishavjnv12
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

packages:
  TorrentUI:
    path: Packages/TorrentUI

settings:
  base:
    DEVELOPMENT_TEAM: YKB8PWS95C
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # Shared engine: Objective-C++ facade over libtorrent, built for macOS and iOS.
  TorrentKit:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: TorrentKit/include
        headerVisibility: public
      - path: TorrentKit/Sources
        headerVisibility: project
    configFiles:
      Debug: Vendor/libtorrent.xcconfig
      Release: Vendor/libtorrent.xcconfig
    dependencies:
      - framework: Vendor/libtorrent.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: TorrentKit
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.TorrentKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CLANG_ENABLE_MODULES: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: YES

  # Command-line harness for exercising the engine against real torrents.
  torrentctl:
    type: tool
    platform: macOS
    sources:
      - Tools/torrentctl
    dependencies:
      - target: TorrentKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: torrentctl
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"

  TorrentKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TorrentKitTests
    dependencies:
      - target: TorrentKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.TorrentKitTests
        GENERATE_INFOPLIST_FILE: YES

  Torrent-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/macOS
      - Shared
    dependencies:
      - target: TorrentKit
      - package: TorrentUI
    entitlements:
      path: Apps/macOS/Torrent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        # Folders picked in Settings or the add sheet stay usable after a relaunch.
        com.apple.security.files.bookmarks.app-scope: true
        # The default download folder, ~/Torrent. Fine for direct (non-App Store) distribution.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Torrent/
    info:
      path: Apps/macOS/Info.plist
      properties:
        # .torrent files open in the app ("Open With", double-click); magnet links from browsers.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent Document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.bittorrent.torrent]
        CFBundleURLTypes:
          - CFBundleURLName: Magnet Link
            CFBundleURLSchemes: [magnet]
        # Remote control: paired iPhones find this Mac on the local network.
        NSBonjourServices: [_torrentremote._tcp]
        NSLocalNetworkUsageDescription: Torrent lets your paired iPhone and iPad control downloads on this Mac.
    settings:
      base:
        PRODUCT_NAME: Torrent
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Torrent tells you when a download finishes." 
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  Torrent-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Shared
      - SharedIOS
    dependencies:
      - target: TorrentKit
      - package: TorrentUI
      - target: TorrentShare
      - target: TorrentWidgets
    entitlements:
      path: Apps/iOS/Torrent.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.rishavjnv12.Torrent]
    info:
      path: Apps/iOS/Info.plist
      properties:
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent Document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.bittorrent.torrent]
        CFBundleURLTypes:
          - CFBundleURLName: Magnet Link
            CFBundleURLSchemes: [magnet]
        NSSupportsLiveActivities: true
        # Remote control: finds Macs running Torrent on the local network.
        NSBonjourServices: [_torrentremote._tcp]
    settings:
      base:
        PRODUCT_NAME: Torrent
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Torrent finds your Mac to control its downloads, and talks to your router so peers can connect to you."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  # Share Sheet: "Share → Torrent" for .torrent files and magnet links from other apps.
  TorrentShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Share
      - SharedIOS/Inbox.swift
    entitlements:
      path: Extensions/Share/TorrentShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.rishavjnv12.Torrent]
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: Torrent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.bittorrent.torrent"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_NAME: TorrentShare
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent.Share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Live Activity and Dynamic Island for downloads.
  TorrentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Widgets
      - SharedIOS/DownloadActivity.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Torrent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TorrentWidgets
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # Remote control: pairing, encryption and a loopback phone-to-Mac session.
  RemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RemoteTests
      - Shared/Remote
      - Shared/TorrentBackend.swift
      - TorrentKitTests/TorrentFixture.swift
    dependencies:
      - target: TorrentKit
      - package: TorrentUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.RemoteTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  TorrentKit:
    build:
      targets:
        TorrentKit: all
    test:
      targets:
        - TorrentKitTests
        - RemoteTests
  torrentctl:
    build:
      targets:
        torrentctl: all
    run:
      config: Debug
  Torrent-macOS:
    build:
      targets:
        Torrent-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  Torrent-iOS:
    build:
      targets:
        Torrent-iOS: all
    run:
      config: Debug
    archive:
      config: Release
