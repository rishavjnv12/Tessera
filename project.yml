# Xcode project spec. Regenerate the project after editing:  xcodegen generate
name: Torrent

options:
  bundleIdPrefix: io.github.rishavjnv12
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

packages:
  TorrentUI:
    path: Packages/TorrentUI

settings:
  base:
    DEVELOPMENT_TEAM: YKB8PWS95C
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # Shared engine: Objective-C++ facade over libtorrent, built for macOS and iOS.
  TorrentKit:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - path: TorrentKit/include
        headerVisibility: public
      - path: TorrentKit/Sources
    configFiles:
      Debug: Vendor/libtorrent.xcconfig
      Release: Vendor/libtorrent.xcconfig
    dependencies:
      - framework: Vendor/libtorrent.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: TorrentKit
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.TorrentKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CLANG_ENABLE_MODULES: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: YES

  Torrent-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/macOS
      - Shared
    dependencies:
      - target: TorrentKit
      - package: TorrentUI
    entitlements:
      path: Apps/macOS/Torrent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_NAME: Torrent
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  Torrent-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Shared
    dependencies:
      - target: TorrentKit
      - package: TorrentUI
    settings:
      base:
        PRODUCT_NAME: Torrent
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rishavjnv12.Torrent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Torrent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  Torrent-macOS:
    build:
      targets:
        Torrent-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  Torrent-iOS:
    build:
      targets:
        Torrent-iOS: all
    run:
      config: Debug
    archive:
      config: Release
